<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Create, customize, and copy your own custom quotes instantly with our easy-to-use online Quote Generator.">
<title>Quote Generator - Create & Copy Custom Quotes</title>

<style>
body {
background-color: #f0f2f5;
display: flex;
flex-directon: column;
justify-content: center;
align-items: center;
height: 100vh;
}

.container {
background-color: #fff;
border-radius: 24px;
box-shadow: 2px 2px 3px 4px rgba(0, 0, 0, 0.1);
padding: 10px;
}

.quote, 
input[type="text"], 
input:focus {
border: 0 none !important;
outline: 0 none !important;
box-shadow: none !important;
background-image: none !important;
-webkit-appearance: none !important;
appearance: none !important;
field-sizing: content !important;
font-family: "Times New Roman";
}

h2 {
font-family: sans-serif;
}

span {
font-family: sans-serif;
}
    
.github {
text-decoration: 0;
background-color: #00f8ff;
border-radius: 10px;
}
    
</style>
</head>
<body>
<div>
<div class="container">
<h2>Quote Generator</h2>
<span>Choose your quote:</span> “<input id="quote" type="text" value="My quote">”
<br>
<span>Generated quote:</span> <input id="output" readonly value="“My quote”">
<button id="copyBtn">Copy</button>

<a target="_blank" href="https://github.com/xchanroldan101/Quote-Generator/" rel="noopener noreferrer" id="github"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
<path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
</svg>
Github
</a>
</div>
</div>
<script>
const input = document.getElementById('quote');
const output = document.getElementById('output');
const button = document.getElementById('copyBtn');

input.addEventListener('input', () => {
output.value = `“${input.value}”`;
});
button.addEventListener('click', async () => {
const text = output.value;

try {
await navigator.clipboard.writeText(text);
    
button.textContent = 'Copied!';
    
setTimeout(() => {
button.textContent = 'Copy';
}, 2000);

} catch (err) {
console.error(err);
button.textContent = 'Failed to copy';
}
});
</script>
</body>
</html>
